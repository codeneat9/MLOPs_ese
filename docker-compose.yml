services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./models:/app/models:ro
      - ./artifacts:/app/artifacts:ro
      - ./smartwaste.db:/app/smartwaste.db
  dashboard:
    build: .
    command: streamlit run src/smartwaste/dashboard.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      SMARTWASTE_API_URL: http://api:8000
    env_file:
      - .env
    depends_on:
      - api
