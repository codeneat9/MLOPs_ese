[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartwaste"
version = "0.1.0"
description = "End-to-end waste image classification MLOps application."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.6",
    "evidently==0.7.15",
    "mlflow==2.19.0",
    "matplotlib==3.10.0",
    "numpy==2.2.1",
    "opencv-python==4.10.0.84",
    "pandas==2.2.3",
    "Pillow==11.1.0",
    "plotly==5.24.1",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.20",
    "requests==2.32.3",
    "pydantic-settings==2.7.1",
    "PyYAML==6.0.2",
    "scikit-learn==1.6.1",
    "SQLAlchemy==2.0.36",
    "streamlit==1.41.1",
    "streamlit-webrtc==0.47.9",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.9.2",
]
dvc = [
    "dvc==3.58.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
smartwaste-live-camera = "smartwaste.live_camera:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
