name: Container deployment

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  build-and-package:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: smartwaste:${{ github.event.workflow_run.head_sha }}
          outputs: type=docker,dest=/tmp/smartwaste.tar
      - uses: actions/upload-artifact@v4
        with:
          name: smartwaste-container-${{ github.event.workflow_run.head_sha }}
          path: /tmp/smartwaste.tar
